<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration - SparkleHome Cleaning</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-subtle);">

  <!-- Site Navigation Bar -->
  <header class="site-header">
    <div class="container">
      <nav class="navbar">
        <a href="index.html" class="brand-logo">
          <div class="logo-icon"><i class="fas fa-broom"></i></div>
          <div class="brand-text">Sparkle<span>Home</span></div>
        </a>

        <ul class="nav-menu" id="navMenu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="services.html" class="nav-link">Services</a></li>
          <li><a href="prices.html" class="nav-link">Prices</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
          <li><a href="booking.html" class="nav-link">Booking</a></li>
        </ul>

        <div class="nav-actions" id="navAuthActions">
          <a href="login.html" class="btn btn-outline-primary btn-sm">
            <i class="fas fa-user"></i> Login
          </a>
        </div>

        <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle Navigation">
          <i class="fas fa-bars"></i>
        </button>
      </nav>
    </div>
  </header>

  <main style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 160px); padding: 3rem 1.5rem;">
    <div class="auth-card" style="width: 100%; max-width: 520px; background: #ffffff; border-radius: var(--radius-xl); padding: 2.75rem 2.25rem; box-shadow: var(--shadow-xl); border: 1px solid var(--border-color);">
      
      <!-- Auth Header -->
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 58px; height: 58px; background: var(--primary-light); color: var(--primary); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem; box-shadow: 0 4px 12px rgba(0, 176, 144, 0.25);">
          <i class="fas fa-user-plus"></i>
        </div>
        <h1 style="font-size: 1.85rem; color: var(--secondary); margin-bottom: 0.35rem;">Create an Account</h1>
        <p style="font-size: 0.92rem; color: var(--text-muted);">
          Join SparkleHome to schedule verified cleaning services with ease.
        </p>
      </div>

      <!-- Registration Form -->
      <form id="userRegisterForm" novalidate>
        
        <!-- Full Name -->
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="regFullName" style="display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 0.4rem;">
            Full Name *
          </label>
          <div style="position: relative;">
            <i class="fas fa-user" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
            <input type="text" id="regFullName" class="form-control" placeholder="e.g. Rahul Sharma" style="padding-left: 2.5rem;" required>
          </div>
        </div>

        <!-- Email & Mobile in 2 columns -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
          <div class="form-group">
            <label for="regEmail" style="display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 0.4rem;">
              Email Address *
            </label>
            <div style="position: relative;">
              <i class="fas fa-envelope" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
              <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" style="padding-left: 2.5rem;" required>
            </div>
          </div>

          <div class="form-group">
            <label for="regMobile" style="display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 0.4rem;">
              Mobile Number *
            </label>
            <div style="position: relative;">
              <i class="fas fa-phone-alt" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
              <input type="tel" id="regMobile" class="form-control" placeholder="10-digit number" maxlength="10" style="padding-left: 2.5rem;" required>
            </div>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="regPassword" style="display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 0.4rem;">
            Create Password *
          </label>
          <div style="position: relative;">
            <i class="fas fa-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
            <input type="password" id="regPassword" class="form-control" placeholder="Min. 6 characters" style="padding-left: 2.5rem; padding-right: 2.5rem;" required>
            <button type="button" class="password-toggle-btn" data-target="regPassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;" aria-label="Toggle password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="regConfirmPassword" style="display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 0.4rem;">
            Confirm Password *
          </label>
          <div style="position: relative;">
            <i class="fas fa-shield-alt" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-type your password" style="padding-left: 2.5rem; padding-right: 2.5rem;" required>
            <button type="button" class="password-toggle-btn" data-target="regConfirmPassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;" aria-label="Toggle password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 1.25rem;">
          <i class="fas fa-user-check"></i> Register Account
        </button>

        <div style="text-align: center; font-size: 0.92rem; color: var(--text-muted);">
          Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: underline;">Log in here</a>
        </div>
      </form>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container" style="text-align: center; padding: 1.5rem 0;">
      <p style="color: var(--text-muted); font-size: 0.85rem;">
        &copy; 2026 SparkleHome Services. User Role: ROLE_USER (Admin rights strictly restricted).
      </p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
