# Server Configuration
server.port=${SERVER_PORT:8080}

# Spring Datasource Configuration (loaded from .env / environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/home_service_booking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:d1f8e4c7b2a6f3e1a8d0c4b2e9f7a5b3c1d8e6f4a2b0c9d7e5f3a1b8c6d4e2f0}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Initial Admin Credentials
app.admin.email=${ADMIN_EMAIL:admin@sparklehome.com}
app.admin.password=${ADMIN_PASSWORD:Admin@Sparkle2026}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080}
